service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/drop_jaeger, batch]
      exporters: [jaeger_storage_exporter]

extensions:
  healthcheckv2:
    use_v2: true
    http:

  jaeger_query:
    storage:
      traces: primary_store

  jaeger_storage:
    backends:
      primary_store:
        badger:
          directories:
            keys: /badger/keys
            values: /badger/values
          ephemeral: false
          ttl:
            spans: 168h

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  filter/drop_jaeger:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["service.name"] == "jaeger"'
        - 'attributes["next.span_type"] == "BaseServer.handleRequest" and attributes["http.route"] == nil and attributes["next.route"] == nil'
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: primary_store
